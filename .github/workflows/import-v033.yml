name: Publish linguistic tool installers (v0.3.3)
on:
  push:
    branches: [main]
    paths:
      - '.migration/v0.3.3.patch.xz'
      - '.github/workflows/import-v033.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: publish-v033
  cancel-in-progress: false
jobs:
  import-and-test:
    if: github.repository == 'bhaashik/TreebankCreator'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and apply v0.3.3 update
        shell: bash
        run: |
          set -euo pipefail
          echo '7b0865088b38a3a40f06d4c91a4e0f1c521be5605ebaab4a7f2fe6dce8618642  .migration/v0.3.3.patch.xz' | sha256sum -c -
          xz -dc .migration/v0.3.3.patch.xz > "$RUNNER_TEMP/v033.patch"
          git apply --check "$RUNNER_TEMP/v033.patch"
          git apply --index "$RUNNER_TEMP/v033.patch"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies and test
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[test]' numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pytest -q
          bash -n scripts/install_linguistic_tools.sh
          bash scripts/install_linguistic_tools.sh --aligner simalign --apertium --dry-run
      - name: Publish v0.3.3 and tag, preserving Git history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || { echo 'main changed; refusing to push'; exit 1; }
          git rm -f .migration/v0.3.3.patch.xz .github/workflows/import-v033.yml
          git add -A
          git commit -m 'Add optional Apertium and neural word aligner installer (v0.3.3)'
          git tag -a v0.3.3 -m 'TreebankCreator v0.3.3 optional linguistic tool setup'
          git push origin HEAD:refs/heads/main refs/tags/v0.3.3
      - name: Publish documentation
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
