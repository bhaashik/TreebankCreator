name: Import existing-resource converters (v0.3.1)
on:
  push:
    branches: [main]
    paths:
      - '.migration/resource_import.patch.xz'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-v031
  cancel-in-progress: false
jobs:
  import-and-test:
    if: github.repository == 'bhaashik/TreebankCreator'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and apply tested v0.3.1 patch
        shell: bash
        run: |
          set -euo pipefail
          echo '19888882c630548d4366eb4c8a3b8885fd249d93f63fd45a63dd04ad97b5e7b2  .migration/resource_import.patch.xz' | sha256sum -c -
          xz -dc .migration/resource_import.patch.xz > "$RUNNER_TEMP/resource_import.patch"
          git apply --check "$RUNNER_TEMP/resource_import.patch"
          git apply --index "$RUNNER_TEMP/resource_import.patch"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and run all offline regression tests
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q
      - name: Publish tested source, preserve history and tag release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || { echo 'main changed; refusing to push'; exit 1; }
          git rm -f .migration/resource_import.patch.xz .github/workflows/import-resources.yml
          git add -A
          git commit -m 'Add independent existing-alignment and Apertium JSONL imports (v0.3.1)'
          git tag -a v0.3.1 -m 'UD Treebank Lab v0.3.1: supplied resource import'
          git push origin HEAD:refs/heads/main refs/tags/v0.3.1
